info:
  version: 1.0.0
  description: UPF configuration

configuration:
  # debugLevel: panic|fatal|error|warn|info|debug|trace
  debugLevel: info
  # ReportCaller: true|false
  ReportCaller: false

  pfcp:
    - addr: 127.0.0.8

  gtpu:
    # Logical N3 address advertised to SMF in PFCP. UPF-U owns packet I/O.
    - addr: 192.168.2.2
    # [optional] gtpu.name
    # - name: upf.5gc.nctu.me
    # [optional] gtpu.ifname
    # - ifname: gtpif

  # Dataplane port mapping (must match UPF-U upf_u.yaml ports)
  # NOTE: SGi follows CORE by convention (same physical port)
  dataplane_ports:
    access: 0
    core: 1
    sgi: 1

  dnn_list:
    - dnn: internet
      cidr: 10.60.0.0/16
      # [optional] dnn_list[*].natifname
      # natifname: eth0
